# ═══════════════════════════════════════════════════════════════════════════
# 阶段一：云端实验验证（本地没有合适机器时，用 GitHub runner 先跑一遍）
#
# 【放置位置】放到你 fork 的仓库里：
#   .github/workflows/experiment.yml                    ← 本文件
#   tools/offline-kit/experiment.sh                     ← 本工具包的 experiment.sh
#   tools/offline-kit/build-offline.sh                  ← 本工具包的 build-offline.sh（阶段二用）
#
# 【干什么】在 amd64 / arm64 runner 上装 dsh，确认「这个版本能装上、原生模块对」。
#
# 【smoke 开关】默认 skip —— 只装不启服务，最快，也不卡失败。
#   skip    : 不起 Web 服务（推荐：Web 能不能打开，最终你在真机上用浏览器确认最准）
#   warn    : 起一次 Web 服务做判活，不通过也只是警告
#   require : 起服务且判活不通过就直接判 job 失败
#
# 【为什么默认不验证 Web】dsh 的 Web 服务带 token 鉴权：
#   启动时打印 `dsh web: http://127.0.0.1:3080/?token=<...>`，
#   不带 token 直接 GET / 会回 401。用 curl -f 探会把 401 误判成「没起来」。
#   所以云端判活参考价值有限，真机开一眼才是终局。
#
# 【注意】GitHub 的 arm64 runner（ubuntu-24.04-arm）**只对 Public 仓库免费**，
#         私有仓库会消耗付费额度。
# ═══════════════════════════════════════════════════════════════════════════
name: Experiment dsh (amd64 + arm64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'dsh 版本：auto=自动取 npm 最新版；填 0.2.1-rc.2 可锁定；next/alpha 追标签'
        required: false
        default: 'auto'
      dist_tag:
        description: 'version=auto 时读取哪个 npm dist-tag'
        required: false
        default: 'latest'
        type: choice
        options: [latest, next, alpha]
      arch:
        description: '跑哪些架构'
        required: false
        default: 'both'
        type: choice
        options: [both, amd64, arm64]
      from_source:
        description: '从源码构建（慢，10~30 分钟）'
        required: false
        default: false
        type: boolean
      smoke:
        description: 'Web 冒烟：skip=不起服务(最快) / warn=起服务但不卡失败 / require=必须起来否则判失败'
        required: false
        default: 'skip'
        type: choice
        options: [skip, warn, require]

permissions:
  contents: read

jobs:
  experiment:
    # 不能用 job 级 if 引用 matrix（matrix 在 job 展开前求值），所以用动态 matrix 过滤
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event.inputs.arch || 'both') == 'both' && '{"include":[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}' || (github.event.inputs.arch || 'both') == 'amd64' && '{"include":[{"arch":"amd64","runner":"ubuntu-latest"}]}' || '{"include":[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}') }}
    name: Experiment ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          # dsh 0.2.2-rc.1 起 engines.node >=24.9.0
          node-version: '24'

      - name: Locate kit script
        id: kit
        run: |
          # 三个位置都认：tools/offline-kit/ 、offline-kit/ 、仓库根目录
          for d in tools/offline-kit offline-kit .; do
            if [ -f "$d/experiment.sh" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "找到脚本：$d/experiment.sh"
              exit 0
            fi
          done
          echo "::error::找不到 experiment.sh。请上传到以下任一位置：tools/offline-kit/ 、offline-kit/ 、或仓库根目录"
          exit 1

      - name: Diagnostics
        run: |
          echo "arch    : $(uname -m)"
          echo "runner  : ${{ matrix.runner }}"
          echo "node    : $(node --version)"
          echo "npm     : $(npm --version)"
          echo "glibc   : $(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -1)"
          echo "脚本目录: ${{ steps.kit.outputs.dir }}"

      - name: Prepare pnpm (only for --from-source)
        if: ${{ inputs.from_source }}
        run: |
          corepack enable || true
          corepack prepare pnpm@11.28.5 --activate || npm i -g pnpm@11.28.5 || true
          pnpm --version || true

      - name: Run experiment (install dsh)
        id: exp
        env:
          DSH_VERSION: ${{ inputs.version }}
          DSH_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -uo pipefail
          FLAGS=""
          if [ "${{ inputs.from_source }}" = "true" ]; then FLAGS="$FLAGS --from-source"; fi
          if [ "${{ inputs.smoke }}" = "skip" ]; then FLAGS="$FLAGS --no-smoke"; fi
          mkdir -p "$HOME/.dsh-lab"
          bash "${{ steps.kit.outputs.dir }}/experiment.sh" --version "${DSH_VERSION}" $FLAGS \
            2>&1 | tee "$HOME/.dsh-lab/run.log"
          # experiment.sh 会把解析后的版本写进 $GITHUB_OUTPUT；同一 step 内
          # 还没法用 steps.exp.outputs.*，直接从文件里读出来打印
          grep '^dsh_version=' "$GITHUB_OUTPUT" 2>/dev/null | tail -1 || true
          # 脚本会打印 SMOKE=1 / SMOKE=0 / SMOKE=SKIP 供下一步判定
          SMOKE="$(grep -o '^SMOKE=[A-Za-z0-9]*' "$HOME/.dsh-lab/run.log" | tail -1 | cut -d= -f2)"
          echo "smoke=${SMOKE:-SKIP}" >> "$GITHUB_OUTPUT"
          echo "smoke_result=${SMOKE:-SKIP}"

      - name: Gate on Web readiness (only when smoke=require)
        # 默认 skip/warn 都不卡失败：Web 能不能打开，最终由你在真机上用浏览器确认
        if: ${{ inputs.smoke == 'require' && steps.exp.outputs.smoke != '1' }}
        run: |
          echo "::error::Web UI 未能就绪（smoke=require）。看 experiment-logs 里的 web.log"
          exit 1

      - name: Collect logs
        if: always()
        run: |
          # ⚠️ 别用 cp -r "$HOME/.dsh-lab"/. ：那会把 600+ 包的 node_modules 也收进来，
          #    artifact 直接膨胀到 200MB+，还会被误认成「离线包」。这里只收日志与诊断快照。
          mkdir -p dsh-lab-logs
          find "$HOME/.dsh-lab" -maxdepth 1 -type f \( -name '*.log' -o -name '*.txt' \) \
            -exec cp {} dsh-lab-logs/ \; 2>/dev/null || true
          {
            echo "=== $(uname -m) · $(node --version) ==="
            echo "① dsh 版本"
            ls -1 "$HOME/.dsh-lab/app/node_modules/@deepseek-ai/dsh/package.json" >/dev/null 2>&1 \
              && node -p "require('$HOME/.dsh-lab/app/node_modules/@deepseek-ai/dsh/package.json').version" 2>/dev/null \
              || echo "  (未安装)"
            echo "② @deepseek-ai 包数量"
            ls -1 "$HOME/.dsh-lab/app/node_modules/@deepseek-ai" 2>/dev/null | wc -l
            echo "③ 原生模块"
            ls -d "$HOME/.dsh-lab"/app/node_modules/@deepseek-ai/node-addon-system-* 2>/dev/null \
              | xargs -n1 basename 2>/dev/null || echo "  ⚠ 无"
            ls "$HOME/.dsh-lab"/app/node_modules/node-pty/prebuilds/*/pty.node 2>/dev/null \
              | sed 's/^/  pty: /' || echo "  ⚠ node-pty 无预编译二进制"
          } > dsh-lab-logs/env.txt 2>&1
          echo "--- 产物清单（应该只有几 KB）---"
          ls -lh dsh-lab-logs/
          true

      - name: Upload experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-logs-${{ matrix.arch }}
          path: dsh-lab-logs/**
          if-no-files-found: warn
          retention-days: 7

      # 很多人把 experiment-logs-*.zip 当成安装包，这里显式说明
      - name: Final note (this workflow does NOT produce a package)
        if: always()
        run: |
          {
            echo "## ⚠️ 这是「实验」，不是安装包"
            echo ""
            echo "本 workflow 只在云端跑一遍 \`npm install\` + 可选冒烟，**不产出任何离线包**。"
            echo "产物 \`experiment-logs-${{ matrix.arch }}.zip\` 里全是安装日志，里面没有 install.sh。"
            echo ""
            echo "### 要拿可安装的离线包，请改跑这一个："
            echo ""
            echo "> **Actions → Package dsh offline (amd64 + arm64) → Run workflow**"
            echo ""
            echo "| 对比 | 本 workflow | Package dsh offline |"
            echo "|---|---|---|"
            echo "| 产物 | \`experiment-logs-<arch>.zip\`（日志） | \`deepseek-harness-<版本>-offline-<arch>.tar.gz\` |"
            echo "| 能装吗 | ❌ 不能 | ✅ 解压后 \`bash install.sh\` |"
            echo "| 耗时 | 2~5 分钟 | 30~60 分钟 |"
          } >> "$GITHUB_STEP_SUMMARY"
